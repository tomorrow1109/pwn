# ret2shell 题目环境配置
#
# 用法：把本文件复制为比赛仓库里的 challenges/<题目>/env.toml，
# 并把 tag 换成平台上实际上传后的镜像地址（后台上传 tar 后会显示 tag）。
#
# 关键点：
#   * internet = false —— 套用 internet-disabled NetworkPolicy，容器完全不能出网（含 DNS）
#   * port / protocol / app_protocol —— Pwn 题固定 tcp + raw
#   * mem / cpu 是 limits，必须显式写；requests 保持较小即可

internet   = false
restricted = false
privileged = false

[[images]]
name         = "pwn"
tag          = "registry:5000/test_6adf7900/pwn:latest"
pull_policy  = "IfNotPresent"
cpu          = 0.5
cpu_req      = 0.05
mem          = "128Mi"
mem_req      = "32Mi"
storage      = "512Mi"
storage_req  = "64Mi"
port         = 9999
protocol     = "tcp"
app_protocol = "raw"
description  = "socat 反代的 ret2win 服务"
restricted   = false
